
[/Script/McpAutomationBridge.McpAutomationBridgeSettings]
bEnableNativeMCP=True
NativeMCPPort=3000

; ---------------------------------------------------------------------------
; Assets loaded from C++ by string path are invisible to the cooker, because
; it only follows hard references out of cooked packages (the map, blueprints).
; TetrisGame.cpp / TetrisBoard3D.cpp LoadObject() every material, sound and the
; music track at runtime, so none of them were being shipped: in the packaged
; build the pieces fell back to the grey default material and the game was
; completely silent. This forces those folders into the cook.
;
; ensureMsgf() in those LoadObject calls compiles out of Shipping builds, which
; is why nothing ever complained about the null assets.
;
; Both the legacy and current section names are listed deliberately -- BaseEngine
; carries a ClassRedirect between them and the engine's own plugins still use
; the legacy spelling. A duplicate path in the always-cook list is harmless.
; ---------------------------------------------------------------------------
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Sounds")

[/Script/DeveloperToolSettings.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Sounds")
